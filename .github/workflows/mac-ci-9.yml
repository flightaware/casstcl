name: Mac TCL9 build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        brew update
        brew install autoconf
        brew uninstall tcl-tk@8
        brew install tcl-tk@9
        brew reinstall libuv openssl cmake libtommath
        brew install zlib
        git clone https://github.com/apache/cassandra-cpp-driver.git
        cd cassandra-cpp-driver
        sed -i '' -e '149s/this/(void *)this/' src/md5.cpp
        mkdir build
        cd build
        cmake ..
        make
        sudo make install
    - name: configure
      run: |
        export LDFLAGS="-L/opt/homebrew/opt/zlib/lib -L/opt/homebrew/opt/libtommath/lib $LDFLAGS"
        export CPPFLAGS="-I/opt/homebrew/opt/zlib/include -I/opt/homebrew/opt/libtommath/include $CPPFLAGS"
        autoreconf -vi
        PREFIX=/opt/homebrew/opt/tcl-tk@9
        ./configure --with-tcl=$PREFIX/lib --prefix=$PREFIX
    - name: make
      run: |
        #export LDFLAGS="-L/opt/homebrew/opt/zlib/lib -L/opt/homebrew/opt/libtommath/lib $LDFLAGS"
        #export CPPFLAGS="-I/opt/homebrew/opt/zlib/include -L/opt/homebrew/opt/libtommath/include $CPPFLAGS"
        make
    - name: install
      run: sudo make install
