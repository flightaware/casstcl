name: Mac TCL8 build

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build:

    runs-on: macos-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        brew update
        brew install autoconf
        brew reinstall tcl-tk@8
        brew install libuv openssl zlib cmake
        git clone https://github.com/apache/cassandra-cpp-driver.git
        cd cassandra-cpp-driver
        mkdir build
        cd build
        cmake ..
        make
        sudo make install
    - name: configure
      run: |
        autoreconf -vi
        PREFIX=/opt/homebrew/opt/tcl-tk@8
        ./configure --with-tcl=$PREFIX/lib --prefix=$PREFIX
    - name: make
      run: make
    - name: install
      run: sudo make install
