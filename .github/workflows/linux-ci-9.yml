# This is a basic workflow to help you get started with Actions

name: Linux TCL9 build

# Controls when the action will run.
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  build-test:

    runs-on: ubuntu-26.04

    services:
      cassandra:
        image: cassandra
        ports:
          - 9042:9042

    steps:
    - uses: actions/checkout@v4
    - name: Install dependencies
      run: |
        sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
        sudo apt-get update -qq
        sudo apt-get install -y gcc-11 g++-11
        sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-11 110 --slave /usr/bin/g++ g++ /usr/bin/g++-11
        sudo apt-get install -y tcl9.0-dev
        sudo apt-get install -y libuv1-dev libssl-dev zlib1g-dev build-essential cmake libtommath-dev
        git clone https://github.com/apache/cassandra-cpp-driver.git
        cd cassandra-cpp-driver
        mkdir build
        cd build
        cmake ..
        make
        sudo make install
    - name: configure
      run: |
        autoreconf -vi
        ./configure --with-tcl=/usr/lib/tcl9.0
    - name: make
      run: make
    - name: install
      run: sudo make install
    - name: test
      run: |
        export LD_LIBRARY_PATH=/usr/local/lib/x86_64-linux-gnu:$LD_LIBRARY_PATH
        export CASSTCL_DEBUG=1
        export CASSTCL_LOG_LEVEL=trace
        make test
